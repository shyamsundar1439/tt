name: Study Reminders Trigger

on:
  schedule:
    - cron: "45 23 * * *" # 05:15 IST
    - cron: "30 1 * * *"  # 07:00 IST
    - cron: "0 13 * * *"  # 18:30 IST
    - cron: "15 15 * * *" # 20:45 IST
  workflow_dispatch: {}

permissions: {}

jobs:
  trigger-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Validate configuration
        run: |
          if [ -z "${{ vars.RENDER_BASE_URL }}" ]; then
            echo "Missing repository variable RENDER_BASE_URL"
            exit 1
          fi
      - name: Resolve cron secret
        id: resolve-cron-secret
        env:
          SECRET_CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VAR_CRON_SECRET: ${{ vars.CRON_SECRET }}
        run: |
          CRON_SECRET="$SECRET_CRON_SECRET"
          if [ -z "$CRON_SECRET" ]; then
            CRON_SECRET="$VAR_CRON_SECRET"
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "Missing CRON_SECRET (configure repository secret CRON_SECRET or variable CRON_SECRET)"
            exit 1
          fi

          echo "::add-mask::$CRON_SECRET"
          echo "cron_secret=$CRON_SECRET" >> "$GITHUB_OUTPUT"
      - name: Trigger scheduled reminder dispatch
        run: |
          curl --fail --show-error --silent \
            --retry 3 \
            --max-time 20 \
            -H "X-Cron-Secret: ${{ steps.resolve-cron-secret.outputs.cron_secret }}" \
            -X POST \
            "${{ vars.RENDER_BASE_URL }}/api/notifications/trigger-scheduled"
